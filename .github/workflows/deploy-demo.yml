# 网页演示版 → GitHub Pages（Source = GitHub Actions）
#
# 事实记录（2026-08-24，别再改错方向）：
# Pages 的 Source 已经是 "GitHub Actions"。判据是内置的 pages-build-deployment
# 对新推的提交**完全不再触发**（分支模式下它必触发，11:12 那次就触发过），
# 等了 7 分钟零记录。所以发布权在这个 workflow 手里，不在分支上。
#
# 曾经走错的一版：把这里改成「只做产物校验、不部署」，同时把构建产物同步进仓库根，
# 想蹭分支模式免设置发布。结果是**没有任何东西负责发布**，线上停在旧版本，
# /assets/*.js 全 404。教训是：改发布链之前先确认发布源是谁，别靠猜。
#
# 上线地址：https://yuhangziyue.github.io/life-os/
# 页面是 base: './' + HashRouter，子路径直接可用，不需要任何 rewrite 规则。

name: 部署网页演示版

on:
  push:
    branches: [main]
    paths:
      - 'electron2/src/**'
      - 'electron2/web/**'
      - 'electron2/vite.web.config.ts'
      - 'electron2/scripts/**'
      - 'electron2/package.json'
      - 'electron2/tailwind.config.ts'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 本机默认 node 是 v16，Vite 6 在那上面会死在 crypto.getRandomValues 上。
          # CI 固定 20，别跟着本机默认版本漂。
          node-version: '20'
          cache: npm
          cache-dependency-path: electron2/package-lock.json

      # --ignore-scripts 跳过 better-sqlite3 的原生编译：那是 Electron 主进程用的，
      # 网页版 bundle 里没有它，在 CI 上编译一遍纯属白等（还可能因工具链差异直接失败）。
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      # build:web 自带产物门禁（scripts/finalize-web.mjs）：
      # 缺 index.html / 缺 css / js 明显偏小都会让这一步非零退出，
      # 不会把一个白屏的壳子推上线。
      - run: npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: electron2/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
