# 网页演示版 —— 构建 + 产物防漂移门禁
#
# ★ 发布方式（2026-08-24 用实证确定，别再靠猜改）
#
# Pages 的 Source 是 **Deploy from a branch: main / (root)**。
# 发布由 GitHub 内置的 `pages build and deployment` 完成，**不是**这个 workflow。
# 所以仓库根目录的 index.html + assets/ 就是线上页面，
# 由 electron2/scripts/sync-pages.mjs 同步进来，清单在 .pages-manifest。
#
# 怎么确定的（三条互相印证的证据）：
#   1. 删掉根目录产物后，线上 /assets/*.js 立刻 404 —— 线上内容就来自根目录
#   2. 内置 pages-build-deployment 对 ece6ee5 / b9c971d 都触发了，且成功
#   3. b9c971d 只改了 md 和删产物、没命中本 workflow 的 paths，
#      于是只有内置部署跑了，它发布了空根目录 —— 这就是当时 404 的直接原因
#
# 走过的弯路（留着防止重犯）：中途因为「内置部署对 6567e02 漏触发了一次」，
# 误判成 Source 已改为 GitHub Actions，把这里换成 upload-pages-artifact + deploy-pages。
# 那一版 deploy 竟然也 success，于是更加确信 —— 但真正把 demo 送上线的是同一时刻
# 并行跑的内置部署。**两条链同时成功，会让人把功劳记在错的那条上。**
#
# 这个 workflow 现在只干一件事，但很关键：
#   把 src 重新构建一遍，逐字节比对根目录产物是否与之一致。
# 产物入库最大的风险是「改了 src 忘了同步 ⇒ 线上悄悄跑旧版本」——不报错、没人发现。
# 忘同步的修法：npm run deploy:pages 然后提交推送。
#
# paths 必须同时盯住 src 和根目录产物：只盯 src 的话，
# 一次「只动产物」的提交会绕过门禁（b9c971d 就是这样溜过去的）。

name: 网页演示版构建校验

on:
  push:
    branches: [main]
    paths:
      - 'electron2/src/**'
      - 'electron2/web/**'
      - 'electron2/vite.web.config.ts'
      - 'electron2/scripts/**'
      - 'electron2/package.json'
      - 'electron2/tailwind.config.ts'
      - 'index.html'
      - 'assets/**'
      - '.nojekyll'
      - '.pages-manifest'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 本机默认 node 是 v16，Vite 6 在那上面会死在 crypto.getRandomValues 上。
          # CI 固定 20，别跟着本机默认版本漂。
          node-version: '20'
          cache: npm
          cache-dependency-path: electron2/package-lock.json

      # --ignore-scripts 跳过 better-sqlite3 的原生编译：那是 Electron 主进程用的，
      # 网页版 bundle 里没有它，在 CI 上编译一遍纯属白等（还可能因工具链差异直接失败）。
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      # build:web 自带产物门禁（缺 index.html / 缺 css / js 明显偏小都会红），
      # sync-pages --check 再管「根目录那份是不是最新的」。
      - run: npm run check:pages

# ---- 若日后把 Pages Source 改成 "GitHub Actions"，用下面这段替换上面的 verify job ----
